<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Brooklyn Brotherhood</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#121110">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --iron:#121110;
  --iron-2:#1a1815;
  --bone:#e6dfd1;
  --bone-dim:rgba(230,223,209,.55);
  --bone-faint:rgba(230,223,209,.32);
  --fire:#c2491d;
  --fire-hot:#d95a29;
  --line:#3d3931;
  --line-strong:#57503f;
  --f-disp:"Big Shoulders Display","Arial Narrow",sans-serif;
  --f-body:"Libre Franklin","Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html{height:100%}
body{
  margin:0;background:var(--iron);color:var(--bone);
  font-family:var(--f-body);line-height:1.6;
  -webkit-font-smoothing:antialiased;
  display:grid;place-items:center;min-height:100%;
  padding:2rem 1.25rem;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(90% 70% at 50% 30%, rgba(26,24,21,0), rgba(0,0,0,.5) 100%);
}

.panel{position:relative;z-index:2;text-align:center;max-width:26rem;width:100%}

.mark{width:92px;height:104px;margin:0 auto 2rem;display:block}

.eyebrow{
  font-weight:700;color:var(--fire);
  font-size:.68rem;letter-spacing:.36em;text-indent:.36em;text-transform:uppercase;
  margin:0 0 .9rem;
}
h1{
  font-family:var(--f-disp);font-weight:800;text-transform:uppercase;
  font-size:clamp(3rem,13vw,4.6rem);line-height:.92;margin:0;letter-spacing:.015em;
}
.bar{width:56px;height:4px;background:var(--fire);margin:1.6rem auto 0}

/* the four archetypes */
.arche{
  display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;
  max-width:21rem;margin:1.7rem auto 0;
}
.arche .a{display:flex;flex-direction:column;align-items:center;gap:.45rem;color:var(--line-strong)}
.arche svg{width:26px;height:26px;display:block}
.arche span{
  font-family:var(--f-disp);font-weight:700;text-transform:uppercase;
  font-size:.86rem;letter-spacing:.14em;text-indent:.14em;color:var(--bone-dim);
}

/* gate */
.sub{color:var(--bone-dim);font-size:.95rem;font-weight:500;margin:1.6rem 0 0}
.field{
  display:flex;align-items:stretch;max-width:21rem;margin:1.8rem auto 0;
  border:2px solid var(--line-strong);background:var(--iron-2);
}
.field:focus-within{border-color:var(--bone)}
.field input{
  flex:1;min-width:0;background:transparent;border:0;
  color:var(--bone);font-weight:600;font-size:1.05rem;
  padding:.95rem 1.1rem;outline:none;letter-spacing:.12em;
}
.field input::placeholder{color:var(--bone-faint);font-weight:500;letter-spacing:.04em}
.field button{
  background:var(--fire);color:#f2ece0;border:0;cursor:pointer;
  font-family:var(--f-disp);font-weight:700;font-size:1rem;letter-spacing:.14em;text-indent:.14em;
  text-transform:uppercase;padding:0 1.5rem;transition:background .15s;
}
.field button:hover,.field button:active{background:var(--fire-hot)}
.err{color:#cf7a55;font-size:.85rem;font-weight:500;margin-top:1rem;min-height:1.35em;opacity:0;transition:opacity .2s}
.err.on{opacity:1}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

/* ============ INITIATION SEQUENCE ============ */
#rite{
  position:fixed;inset:0;z-index:50;display:none;
  background:#0b0a09;
  align-items:center;justify-content:center;text-align:center;
}
#rite.on{display:flex}
.rite-inner{transform:translateY(-2vh);position:relative;padding:0 1.25rem;max-width:100%}
#rite .mark{width:120px;height:136px;margin:0 auto;opacity:0}
#rite.on .mark{animation:crest-in .5s .1s cubic-bezier(.2,1.4,.4,1) both}
@keyframes crest-in{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
/* the flame ignites: fill sweeps up via clip */
#rite .flame-lit{clip-path:inset(100% 0 0 0)}
#rite.on .flame-lit{animation:ignite .7s .55s ease-out both}
@keyframes ignite{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
/* alive only during the rite: a low, heavy flicker */
#rite.on .flame-lit path{transform-origin:46px 82px;animation:live 1.1s 1.25s ease-in-out infinite}
@keyframes live{
  0%,100%{transform:scaleY(1)}
  30%{transform:scaleY(1.04) skewX(.8deg)}
  60%{transform:scaleY(.97)}
  80%{transform:scaleY(1.02) skewX(-.6deg)}
}

.stamp{
  font-family:var(--f-disp);font-weight:800;text-transform:uppercase;
  font-size:clamp(2.6rem,10vw,4.2rem);line-height:1;letter-spacing:.04em;
  color:var(--bone);margin:1.6rem 0 0;opacity:0;
}
#rite.on .stamp{animation:stamp .38s 1.35s cubic-bezier(.15,1.3,.3,1) both}
@keyframes stamp{
  0%{opacity:0;transform:scale(1.9)}
  70%{opacity:1;transform:scale(.97)}
  100%{opacity:1;transform:scale(1)}
}
.stamp .fire-word{color:var(--fire)}
.stamp-sub{
  font-family:var(--f-body);font-weight:600;font-size:.72rem;
  letter-spacing:.4em;text-indent:.4em;text-transform:uppercase;
  color:var(--bone-dim);margin-top:1rem;opacity:0;
}
#rite.on .stamp-sub{animation:fade-up .5s 1.75s ease both}
@keyframes fade-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* the whole screen thuds when the word lands */
#rite.on{animation:thud .3s 1.35s ease-out}
@keyframes thud{0%{transform:translateY(0)}30%{transform:translateY(5px)}100%{transform:translateY(0)}}
/* the curtain lifts: black screen wipes upward, page revealed beneath */
#rite.leaving{animation:curtain .65s cubic-bezier(.7,0,.2,1) both !important}
#rite.leaving .rite-inner{animation:inner-up .65s cubic-bezier(.7,0,.2,1) both}
@keyframes curtain{to{clip-path:inset(0 0 100% 0)}}
@keyframes inner-up{to{transform:translateY(-40vh);opacity:0}}

/* inside */
#inside{display:none}
#inside.on{display:block}
#inside.on > *{opacity:0;animation:rise .55s ease both}
#inside.on > :nth-child(1){animation-delay:.15s}
#inside.on > :nth-child(2){animation-delay:.3s}
#inside.on > :nth-child(3){animation-delay:.42s}
#inside.on > :nth-child(4){animation-delay:.52s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.king{
  margin:2rem auto 0;max-width:21rem;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:1.6rem 0;
}
.king .lbl{
  display:block;font-weight:700;font-size:.66rem;letter-spacing:.34em;text-indent:.34em;
  text-transform:uppercase;color:var(--fire);margin-bottom:.7rem;
}
.king .who{
  font-family:var(--f-disp);font-weight:700;text-transform:uppercase;
  font-size:2.4rem;line-height:1;display:block;letter-spacing:.02em;
}
.king .when{display:block;color:var(--bone-dim);font-size:.92rem;font-weight:500;margin-top:.6rem}

.go{
  display:block;margin:1.8rem auto 0;max-width:21rem;
  background:var(--bone);color:var(--iron);text-decoration:none;
  padding:1.15rem 1.3rem;transition:background .15s;
  font-family:var(--f-disp);font-weight:700;font-size:1.3rem;letter-spacing:.08em;text-indent:.08em;
  text-transform:uppercase;
}
.go small{
  display:block;font-family:var(--f-body);font-weight:500;text-transform:none;
  letter-spacing:.01em;text-indent:0;font-size:.76rem;opacity:.6;margin-top:.25rem;
}
.go:hover,.go:active{background:#fff}
.alt{
  display:inline-block;margin-top:1.4rem;color:var(--bone-dim);
  font-weight:600;font-size:.78rem;letter-spacing:.14em;text-indent:.14em;text-transform:uppercase;
  text-decoration:none;border-bottom:2px solid var(--line-strong);padding-bottom:3px;transition:.15s;
}
.alt:hover{color:var(--bone);border-bottom-color:var(--fire)}
.tiny{margin-top:2.2rem;font-size:.78rem;font-weight:500;color:var(--bone-faint);letter-spacing:.06em;text-transform:uppercase}

@media (max-width: 380px){
  .mark{width:76px;height:86px;margin-bottom:1.6rem}
  .arche{gap:.25rem}
  .arche svg{width:22px;height:22px}
  .arche span{font-size:.72rem;letter-spacing:.09em;text-indent:.09em}
  .field input{font-size:1rem;padding:.85rem .9rem}
  .field button{padding:0 1.1rem;font-size:.92rem}
  .king .who{font-size:2rem}
  #rite .mark{width:100px;height:114px}
  .stamp-sub{letter-spacing:.28em;text-indent:.28em}
}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>

<!-- ====== THE CREST ======
     Angular, forged flame — every edge is a straight cut, like it was
     struck from steel. Shield with a notched shoulder + chevron base. -->
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="crest" viewBox="0 0 92 104">
    <!-- shield: flat top with notched shoulders, tapering to a point -->
    <path d="M8 6h76v14l-6 6v28c0 24-14.5 38.5-32 45C28.5 92.5 14 78 14 54V26l-6-6V6Z"
          fill="#1a1815" stroke="#57503f" stroke-width="2.5" stroke-linejoin="miter"/>
    <!-- inner keyline -->
    <path d="M15 12h62v6.6l-6 6V54c0 20.4-12.2 32.9-25 38.6C33.2 86.9 21 74.4 21 54V24.6l-6-6V12Z"
          fill="none" stroke="#3d3931" stroke-width="1.5"/>
    <!-- rivets on the shoulders -->
    <rect x="12" y="9" width="3" height="3" fill="#57503f"/>
    <rect x="77" y="9" width="3" height="3" fill="#57503f"/>
    <!-- faceted flame: straight cuts only -->
    <path class="flame-body" d="M46 26 56 42l-3 8 8-4-1 14-9 16h-10l-9-16 3-13 6 5-2-12 7-14Z"
          fill="#c2491d" stroke-linejoin="miter"/>
    <!-- negative-space inner facet -->
    <path class="flame-core" d="M46 48l5 8-2 10-3 6-3-6-2-10 5-8Z" fill="#1a1815"/>
    <!-- chevron base -->
    <path d="M28 84 46 92l18-8" fill="none" stroke="#57503f" stroke-width="2.5" stroke-linecap="square"/>
  </symbol>
</svg>

<div class="panel">

  <svg class="mark" aria-hidden="true"><use href="#crest"/></svg>

  <p class="eyebrow">Members Only</p>
  <h1>The<br>Brooklyn<br>Brotherhood</h1>
  <div class="bar"></div>

  <div class="arche" aria-label="The four archetypes">
    <div class="a">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M5 22 5 11l6 5 5-9 5 9 6-5v11Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter"/>
        <path d="M5 25h22" stroke="currentColor" stroke-width="2"/>
      </svg>
      <span>King</span>
    </div>
    <div class="a">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 3v18" stroke="currentColor" stroke-width="2"/>
        <path d="M16 3l3 4h-6l3-4Z" fill="currentColor"/>
        <path d="M9 19h14" stroke="currentColor" stroke-width="2"/>
        <path d="M13 23h6M16 21v7" stroke="currentColor" stroke-width="2"/>
      </svg>
      <span>Warrior</span>
    </div>
    <div class="a">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 4l3.2 8.1L28 13l-6.5 5.8L23.4 28 16 23.2 8.6 28l1.9-9.2L4 13l8.8-.9L16 4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter"/>
        <path d="M16 13l1.6 3.4-1.6 4.2-1.6-4.2L16 13Z" fill="currentColor"/>
      </svg>
      <span>Magician</span>
    </div>
    <div class="a">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 27 5 16V9l5-4 6 6 6-6 5 4v7L16 27Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter"/>
        <path d="M16 11v6" stroke="currentColor" stroke-width="2"/>
      </svg>
      <span>Lover</span>
    </div>
  </div>

  <!-- GATE -->
  <div id="gate">
    <p class="sub">Speak the word, and the circle opens.</p>
    <div class="field">
      <input id="pw" type="password" placeholder="Passcode" autocomplete="off" spellcheck="false"
             autocapitalize="off" autocorrect="off" enterkeyhint="go" aria-label="Passcode">
      <button id="enter" type="button">Enter</button>
    </div>
    <p class="err" id="err">Not it. Try again, brother.</p>
  </div>

  <!-- INSIDE -->
  <div id="inside">
    <p class="king">
      <span class="lbl">Next Circle</span>
      <span class="who" id="king"></span>
      <span class="when" id="when"></span>
    </p>

    <a class="go" id="doc" href="#" target="_blank" rel="noopener">
      Read the Minutes
      <small>Opens the group's Google Doc</small>
    </a>

    <a class="alt" id="agree" href="#" target="_blank" rel="noopener" style="display:none">Group Agreements</a>

    <p class="tiny">Read before every meeting</p>
  </div>
</div>

<!-- INITIATION: plays once on correct passcode -->
<div id="rite" aria-hidden="true">
  <div class="rite-inner">
    <svg class="mark" aria-hidden="true">
      <use href="#crest" style="--x:0"/>
    </svg>
    <!-- lit flame overlay that ignites bottom-to-top -->
    <svg class="mark flame-lit" style="position:absolute;left:50%;transform:translateX(-50%);top:0" viewBox="0 0 92 104" aria-hidden="true">
      <path d="M46 26 56 42l-3 8 8-4-1 14-9 16h-10l-9-16 3-13 6 5-2-12 7-14Z" fill="#d95a29"/>
    </svg>
    <p class="stamp">Welcome,<br><span class="fire-word">Brother</span></p>
    <p class="stamp-sub">The circle opens</p>
  </div>
</div>

<script>
/* ==========================================================
   EDIT THESE. Nothing else needs touching.
   ========================================================== */

// The living minutes doc.
const DOC_URL = "https://docs.google.com/document/d/12HqrCqY2IK63cd8ilDliOk0ALpgb0yXbcKdO6u1wNmk/edit?usp=drivesdk";

// The one line to update every two weeks.
const KING = "Brian";
const WHEN = "Wednesday, August 12";

// Optional. Paste a URL here and a second link appears. Leave empty to hide it.
const AGREEMENTS_URL = "";

// Passcode, scrambled. Currently: brothers  (not case sensitive)
// To change it: open this page → F12 → Console → hashPass("newword") → paste the result here.
const PASS_HASH = "ho63da";

/* ========================================================== */

function hashPass(s){
  let h=5381; s=String(s).toLowerCase().trim();
  for(let i=0;i<s.length;i++){ h=((h<<5)+h)+s.charCodeAt(i); h=h|0; }
  return (h>>>0).toString(36);
}
window.hashPass = hashPass;

const $=id=>document.getElementById(id);
const gate=$("gate"), inside=$("inside"), pw=$("pw"), err=$("err"), rite=$("rite");

$("king").textContent = "King: " + KING;
$("when").textContent = WHEN;
$("doc").href = DOC_URL;
if(AGREEMENTS_URL){ $("agree").href = AGREEMENTS_URL; $("agree").style.display = "inline-block"; }

const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function showInside(){
  gate.style.display = "none";
  inside.classList.add("on");
}

function tryUnlock(){
  if(hashPass(pw.value) === PASS_HASH){
    if(reducedMotion){ showInside(); return; }
    // initiation sequence: crest lands → flame ignites → the word stamps → thud → fade to inside
    rite.classList.add("on");
    setTimeout(()=>{
      showInside();                 // page is already rising beneath...
      rite.classList.add("leaving"); // ...as the curtain lifts off it
      setTimeout(()=>{ rite.classList.remove("on","leaving"); }, 700);
    }, 2900);
  } else {
    err.classList.add("on");
    const p = document.querySelector(".panel");
    p.classList.add("shake");
    setTimeout(()=>p.classList.remove("shake"), 400);
    pw.select();
  }
}
$("enter").addEventListener("click", tryUnlock);
pw.addEventListener("keydown", e=>{ if(e.key==="Enter") tryUnlock(); });
pw.addEventListener("input", ()=>err.classList.remove("on"));

if(window.matchMedia("(hover: hover) and (pointer: fine)").matches){
  window.addEventListener("load", ()=>pw.focus());
}
</script>
</body>
</html>
